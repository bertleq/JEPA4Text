# LLM-JEPA Default Configuration
# See config.py for all available options.

# ── Model ──────────────────────────────────────────
model_name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"

# ── Dataset ────────────────────────────────────────
# Set dataset_path to a HuggingFace dataset id, or "json" with dataset_files
# pointing to a local .jsonl file.  Leave as-is for synthetic demo data.
dataset_path: "__synthetic__"
text_field: "text"
code_field: "code"

# ── JEPA ───────────────────────────────────────────
lambda_jepa: 1.0   # λ — weight of the JEPA loss
num_pred_tokens: 0  # k — number of [PRED] tokens

# ── Sequence lengths ───────────────────────────────
max_seq_len: 512
max_text_len: 256
max_code_len: 256

# ── Training ───────────────────────────────────────
lr: 2.0e-5
weight_decay: 0.01
epochs: 4
batch_size: 4
gradient_accumulation_steps: 1
warmup_ratio: 0.05
seed: 42
bf16: true
fp16: false

# ── LoRA (set use_lora: true to enable) ────────────
use_lora: false
lora_rank: 64
lora_alpha: 128

# ── Logging / Checkpointing ───────────────────────
output_dir: "./checkpoints"
log_every: 10
save_every_epoch: true
use_wandb: false
wandb_project: "llm-jepa"
